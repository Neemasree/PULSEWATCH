services:
  - type: web
    name: pulsewatch-backend
    runtime: node
    rootDir: backend
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3000
      - key: ALLOWED_ORIGIN
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: pulsewatch-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          name: pulsewatch-redis
          type: keyvalue
          property: connectionString
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: SLACK_WEBHOOK_URL
        sync: false
      - key: TRUST_PROXY
        value: "1"

  - type: keyvalue
    name: pulsewatch-redis
    plan: free

databases:
  - name: pulsewatch-db
    databaseName: pulsewatch
    plan: free
